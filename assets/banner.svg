<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 260" width="100%" height="260" fill="none">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f19" />
      <stop offset="50%" stop-color="#111827" />
      <stop offset="100%" stop-color="#1e1b4b" />
    </linearGradient>

    <!-- Accent Gradient -->
    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#6366f1" />
      <stop offset="50%" stop-color="#a855f7" />
      <stop offset="100%" stop-color="#ec4899" />
    </linearGradient>

    <!-- Cyan/Blue Accent -->
    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#6366f1" />
    </linearGradient>

    <!-- Card Background -->
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.85" />
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.95" />
    </linearGradient>

    <!-- Animated Glow Border -->
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1">
        <animate attributeName="stop-color" values="#6366f1;#a855f7;#ec4899;#38bdf8;#6366f1" dur="6s" repeatCount="indefinite" />
      </stop>
      <stop offset="100%" stop-color="#ec4899">
        <animate attributeName="stop-color" values="#ec4899;#38bdf8;#6366f1;#a855f7;#ec4899" dur="6s" repeatCount="indefinite" />
      </stop>
    </linearGradient>

    <!-- Filter for soft glow -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="cardShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000" flood-opacity="0.5" />
    </filter>
  </defs>

  <style>
    @keyframes floatSlow {
      0% { transform: translateY(0px); }
      50% { transform: translateY(-8px); }
      100% { transform: translateY(0px); }
    }
    @keyframes floatFast {
      0% { transform: translateY(0px); }
      50% { transform: translateY(-5px); }
      100% { transform: translateY(0px); }
    }
    @keyframes pulseGlow {
      0% { opacity: 0.4; }
      50% { opacity: 0.85; }
      100% { opacity: 0.4; }
    }
    .floating-card-1 { animation: floatSlow 5s ease-in-out infinite; }
    .floating-card-2 { animation: floatFast 4s ease-in-out infinite 1s; }
    .pulse-glow { animation: pulseGlow 3s ease-in-out infinite; }
    .title-text { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-weight: 800; letter-spacing: -0.5px; }
    .body-text { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-weight: 500; }
  </style>

  <!-- Main Container -->
  <rect x="2" y="2" width="876" height="256" rx="16" fill="url(#bgGrad)" stroke="url(#borderGrad)" stroke-width="2.5" />

  <!-- Ambient Glow Orbs -->
  <circle cx="120" cy="60" r="80" fill="#6366f1" opacity="0.15" filter="url(#glow)" class="pulse-glow" />
  <circle cx="760" cy="200" r="90" fill="#ec4899" opacity="0.12" filter="url(#glow)" class="pulse-glow" />
  <circle cx="480" cy="130" r="100" fill="#38bdf8" opacity="0.08" filter="url(#glow)" />

  <!-- Left Side: Branding and Details -->
  <g transform="translate(45, 38)">
    <!-- Category Badge -->
    <rect x="0" y="0" width="170" height="26" rx="13" fill="#6366f1" fill-opacity="0.2" stroke="#818cf8" stroke-width="1" />
    <text x="12" y="17" fill="#c7d2fe" font-size="11.5" class="body-text" font-weight="600" letter-spacing="0.5">🚀 AWESOME ECOSYSTEM</text>

    <!-- Main Title -->
    <text x="0" y="65" fill="#ffffff" font-size="29" class="title-text">
      Sales Proposal <tspan fill="url(#primaryGrad)">Automation</tspan>
    </text>

    <!-- Subtitle -->
    <text x="0" y="94" fill="#94a3b8" font-size="13.5" class="body-text">
      Curated directory of SaaS leaders, open-source generators, CPQ &amp; e-sign platforms.
    </text>

    <!-- Tags Row -->
    <g transform="translate(0, 125)">
      <!-- Tag 1 -->
      <rect x="0" y="0" width="112" height="28" rx="7" fill="#1e293b" stroke="#334155" stroke-width="1" />
      <text x="12" y="18" fill="#e2e8f0" font-size="11.5" class="body-text">📄 Proposals</text>

      <!-- Tag 2 -->
      <rect x="122" y="0" width="105" height="28" rx="7" fill="#1e293b" stroke="#334155" stroke-width="1" />
      <text x="134" y="18" fill="#e2e8f0" font-size="11.5" class="body-text">✍️ E-Sign</text>

      <!-- Tag 3 -->
      <rect x="237" y="0" width="120" height="28" rx="7" fill="#1e293b" stroke="#334155" stroke-width="1" />
      <text x="249" y="18" fill="#e2e8f0" font-size="11.5" class="body-text">⚡ CPQ &amp; RFP</text>

      <!-- Tag 4 -->
      <rect x="367" y="0" width="125" height="28" rx="7" fill="#1e293b" stroke="#334155" stroke-width="1" />
      <text x="379" y="18" fill="#e2e8f0" font-size="11.5" class="body-text">🔓 Open Source</text>
    </g>

    <!-- Bottom Metrics / Status -->
    <g transform="translate(0, 172)">
      <circle cx="5" cy="5" r="4" fill="#10b981" />
      <text x="16" y="9" fill="#10b981" font-size="12" class="body-text" font-weight="600">Active Ecosystem</text>
      <text x="135" y="9" fill="#64748b" font-size="12" class="body-text">•</text>
      <text x="148" y="9" fill="#94a3b8" font-size="12" class="body-text">Top Proprietary SaaS &amp; Open-Source Alternatives</text>
    </g>
  </g>

  <!-- Right Side: Interactive Mockup Graphics -->
  <!-- Main Document Card -->
  <g class="floating-card-1" transform="translate(565, 34)" filter="url(#cardShadow)">
    <rect x="0" y="0" width="265" height="185" rx="12" fill="url(#cardGrad)" stroke="#334155" stroke-width="1.5" />
    
    <!-- Window Header -->
    <circle cx="16" cy="16" r="4" fill="#ef4444" opacity="0.8" />
    <circle cx="28" cy="16" r="4" fill="#f59e0b" opacity="0.8" />
    <circle cx="40" cy="16" r="4" fill="#10b981" opacity="0.8" />
    <text x="56" y="19" fill="#64748b" font-size="10" class="body-text">enterprise-proposal.pdf</text>
    <line x1="0" y1="30" x2="265" y2="30" stroke="#334155" stroke-width="1" />

    <!-- Proposal Content Lines -->
    <rect x="16" y="44" width="90" height="10" rx="3" fill="#818cf8" opacity="0.9" />
    <rect x="16" y="60" width="150" height="6" rx="2" fill="#475569" />
    <rect x="16" y="72" width="130" height="6" rx="2" fill="#475569" opacity="0.7" />

    <!-- Pricing Table Snippet -->
    <rect x="16" y="90" width="233" height="42" rx="6" fill="#0f172a" stroke="#1e293b" stroke-width="1" />
    <text x="26" y="106" fill="#94a3b8" font-size="9.5" class="body-text">Enterprise Sales Plan</text>
    <text x="26" y="122" fill="#38bdf8" font-size="11.5" class="body-text" font-weight="700">$24,000 / yr</text>
    <rect x="180" y="100" width="59" height="22" rx="5" fill="#10b981" fill-opacity="0.15" stroke="#10b981" stroke-width="1" />
    <text x="188" y="115" fill="#34d399" font-size="9.5" class="body-text" font-weight="600">APPROVED</text>

    <!-- Progress bar -->
    <rect x="16" y="146" width="233" height="5" rx="2.5" fill="#334155" />
    <rect x="16" y="146" width="185" height="5" rx="2.5" fill="url(#primaryGrad)" />
    <text x="16" y="165" fill="#94a3b8" font-size="9.5" class="body-text">Closing Probability: <tspan fill="#38bdf8" font-weight="700">85%</tspan></text>
    <text x="195" y="165" fill="#a855f7" font-size="9.5" class="body-text" font-weight="600">✍️ Signed</text>
  </g>

  <!-- Secondary Floating Card (Deal Closed Chip) -->
  <g class="floating-card-2" transform="translate(680, 160)" filter="url(#cardShadow)">
    <rect x="0" y="0" width="165" height="54" rx="10" fill="#0f172a" stroke="url(#cyanGrad)" stroke-width="1.5" />
    <circle cx="22" cy="27" r="12" fill="#10b981" fill-opacity="0.2" />
    <text x="17" y="32" fill="#10b981" font-size="13">✓</text>
    <text x="42" y="22" fill="#f8fafc" font-size="11" class="body-text" font-weight="700">Contract Closed</text>
    <text x="42" y="38" fill="#38bdf8" font-size="10" class="body-text">+45% Win Velocity</text>
  </g>
</svg>